# Render.com Blueprint: deploys BOTH the FastAPI Backend and Streamlit Frontend
services:
  - type: web
    name: retailrocket-fastapi-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_fastapi.main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: retailrocket-streamlit-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
